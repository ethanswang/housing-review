# Everything the website talks to, locally, for the e2e suite:
# - the API (built from server/) and its Postgres, migrated and seeded by
#   e2e/run.sh, at http://localhost:53001;
# - a stand-in for the Supabase project: Postgres with supabase/schema.sql and
#   seed.sql, PostgREST, and Caddy serving it at http://localhost:54321/rest/v1
#   like Supabase does (e2e/database.spec.ts checks its rules), plus a
#   test-only signing key so tests can sign in.
# Nothing here touches a real project, so tests can write and CI needs no secrets.
services:
  db:
    # Pinned by digest, matching CI and the root compose file.
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_PASSWORD: e2e
    volumes:
      - ./00-supabase-roles.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
      - ../../supabase/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ../../supabase/seed.sql:/docker-entrypoint-initdb.d/20-seed.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 3s
      retries: 30

  postgrest:
    image: postgrest/postgrest:v13.0.4@sha256:a312f4b2e48530a01fc26f5310d547d6c26d087858360e164522e415723a7732
    environment:
      PGRST_DB_URI: postgres://authenticator:e2e-authenticator@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      # Test-only. e2e/stack/anon-key.mjs signs the anon key with it.
      PGRST_JWT_SECRET: e2e-only-jwt-secret-at-least-32-characters-long
    depends_on:
      db:
        condition: service_healthy

  gateway:
    image: caddy:2-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    # Loopback only: the anon key is in this repository.
    ports:
      - '127.0.0.1:54321:54321'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./jwks.json:/srv/auth/v1/.well-known/jwks.json:ro
      - ./gateway-cert.pem:/etc/caddy/gateway-cert.pem:ro
      - ./gateway-key.pem:/etc/caddy/gateway-key.pem:ro
    depends_on:
      - postgrest

  api-db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    command: postgres -c random_page_cost=1.1
    environment:
      POSTGRES_USER: housing
      POSTGRES_PASSWORD: housing_dev
      POSTGRES_DB: housing
    # Loopback only; run.sh migrates and seeds it from the host.
    ports:
      - '127.0.0.1:55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U housing -d housing']
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ../../server
    environment:
      DATABASE_URL: postgres://housing:housing_dev@api-db:5432/housing
      # The gateway's test signing key (see Caddyfile), over https it trusts below.
      SUPABASE_URL: https://gateway:54322
      NODE_EXTRA_CA_CERTS: /etc/ssl/gateway-cert.pem
      NODE_ENV: production
      TRUST_PROXY_HOPS: 0
      LOG_LEVEL: warn
    ports:
      - '127.0.0.1:53001:3001'
    volumes:
      - ./gateway-cert.pem:/etc/ssl/gateway-cert.pem:ro
    depends_on:
      api-db:
        condition: service_healthy
      gateway:
        condition: service_started
