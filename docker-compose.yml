# Local development database. The production database is managed separately;
# this exists so `docker compose up -d` gives every contributor an identical
# Postgres without installing one.
services:
  db:
    image: postgres:17-alpine
    # random_page_cost defaults to 4.0, which models a spinning disk. On SSD
    # storage (Docker Desktop here, gp3 volumes in production) the planner
    # otherwise refuses the trigram indexes and sequentially scans instead:
    # measured 23ms vs 1.3ms for a property search over 50k rows. Keeping the
    # value here means local plans match production plans.
    command: postgres -c random_page_cost=1.1
    environment:
      POSTGRES_USER: housing
      POSTGRES_PASSWORD: housing_dev
      POSTGRES_DB: housing
    # 5433 on the host so this never collides with a Postgres already on 5432.
    ports:
      - '5433:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U housing -d housing']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./server
    environment:
      # `db` is the compose service name, reachable on the compose network.
      # Migrations and seeding run from the host, not from this container: the
      # image excludes migrations/, seeds/ and scripts/, and --omit=dev leaves
      # out node-pg-migrate.
      DATABASE_URL: postgres://housing:housing_dev@db:5432/housing
      NODE_ENV: production
      PORT: 3001
      LOG_LEVEL: info
      # Only used to derive the JWKS URL and the expected token issuer; the
      # service never holds a Supabase secret. A placeholder is fine locally
      # until you sign in against a real project.
      SUPABASE_URL: ${SUPABASE_URL:-https://placeholder.supabase.co}
      # Nothing proxies this service — the port is published straight to the
      # host — so no X-Forwarded-For header should be believed. Trusting one
      # hop here would let any client forge request.ip.
      TRUST_PROXY_HOPS: 0
    ports:
      - '3001:3001'
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
