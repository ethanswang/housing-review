# Keeps pinned versions from going stale. Each update arrives as a pull request
# and goes through CI and review like any other change.
version: 2
updates:
  # Actions in .github/workflows, pinned by commit with the release in a comment.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }

  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      # One PR for routine minor and patch updates instead of one per package.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /server
    schedule: { interval: weekly }
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # The API image's base, pinned by digest in server/Dockerfile.
  - package-ecosystem: docker
    directory: /server
    schedule: { interval: weekly }
