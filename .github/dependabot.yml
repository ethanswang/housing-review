# Security updates only. Dependabot still opens a pull request when a
# dependency has a known vulnerability (repository setting: Dependabot security
# updates). Routine version bumps are off (open-pull-requests-limit: 0): for a
# small project they were mostly noise, and majors are better moved on purpose.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
  - package-ecosystem: npm
    directory: /server
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
  - package-ecosystem: docker
    directory: /server
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
