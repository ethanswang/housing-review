name: CI

on:
  pull_request:
  push:
    branches: [main]

# Only reading the repository. Without this the workflow inherits whatever the
# repository default is, which on older settings is read/write — and the web
# job's `npm ci` runs dependency lifecycle scripts with that token in scope.
permissions:
  contents: read

# Actions are pinned to a commit and images to a digest, not to tags: a tag can
# be re-pointed at different code after review, a commit cannot. Dependabot
# (.github/dependabot.yml) proposes updates to the actions; the trailing comment
# names the release each pin corresponds to. The Postgres service image below
# is updated by hand, together with docker-compose.yml and DB_PG_IMAGE in
# infra/lib/db-tunnel.sh: Dependabot does not read service images.

# A second push to a branch makes the first run irrelevant. Not so on main:
# cancelling there would leave a merged commit with no completed check, so each
# main commit is allowed to finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Web app (lint, types, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx next build
        env:
          # lib/supabase.ts validates its environment at import time, so the
          # build needs values present. These are placeholders: the build never
          # connects, because every page is dynamic and renders at request time.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

  api:
    name: API (types, schema, tests)
    runs-on: ubuntu-latest

    # A real Postgres, not a mock: the schema tests assert constraint and
    # trigger behaviour, and the endpoint tests run actual SQL against views.
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: housing
          POSTGRES_PASSWORD: housing_dev
          POSTGRES_DB: housing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U housing -d housing"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://housing:housing_dev@localhost:5432/housing

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Apply migrations
        run: npm run db:migrate
      - name: Load development data
        run: npm run db:seed
      - run: npm test

  image:
    name: Container builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the API image
        run: docker build -t uiuc-housing-api:ci ./server
      - name: It starts and reports liveness with no database reachable
        run: |
          # LOG_LEVEL=error, not silent: a failed boot is reported through the
          # logger, and at `silent` the failure dump below would print nothing.
          docker run -d --name api-ci -p 3001:3001 \
            -e DATABASE_URL=postgres://unused:unused@127.0.0.1:5432/unused \
            -e SUPABASE_URL=https://placeholder.supabase.co \
            -e LOG_LEVEL=error uiuc-housing-api:ci

          # --retry-all-errors, not --retry-connrefused: docker publishes the
          # port before the process inside listens, so early connections are
          # accepted and reset rather than refused. curl exits 56 on a reset and
          # does not treat it as retryable, which fails instantly.
          if ! curl -sf --retry 30 --retry-delay 1 --retry-all-errors \
                 http://127.0.0.1:3001/healthz; then
            echo '--- container logs ---'; docker logs api-ci; exit 1
          fi

          # The image's own HEALTHCHECK must agree. It reads PORT and calls
          # /healthz, which never touches the database — so a container with no
          # database at all still has to report healthy. If liveness ever starts
          # depending on the database, this step fails here rather than during
          # a real outage.
          # The image's HEALTHCHECK has a 30s interval, so the first probe does
          # not fire until t=30s. This loop used to stop after 30 iterations
          # and measured healthy on iteration 29, one second of slack that a
          # loaded runner would miss; 90 leaves room.
          for _ in $(seq 1 90); do
            status=$(docker inspect --format '{{.State.Health.Status}}' api-ci)
            [ "$status" = healthy ] && break
            [ "$status" = unhealthy ] && break
            sleep 1
          done
          echo "docker-reported health: $status"
          if [ "$status" != healthy ]; then
            echo '--- container logs ---'; docker logs api-ci; exit 1
          fi

          docker rm -f api-ci

  infra:
    name: Infrastructure (format, validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install OpenTofu
        # Downloaded and checksum-verified rather than pulled in as a
        # third-party action, so the whole supply chain for this job is two
        # commands you can read.
        run: |
          VERSION=1.12.6
          ZIP="tofu_${VERSION}_linux_amd64.zip"
          BASE="https://github.com/opentofu/opentofu/releases/download/v${VERSION}"
          curl -sSLo "$ZIP" "$BASE/$ZIP"
          curl -sSLo sums.txt "$BASE/tofu_${VERSION}_SHA256SUMS"
          grep " $ZIP$" sums.txt | sha256sum -c -
          unzip -oq "$ZIP" tofu
          sudo install -m 0755 tofu /usr/local/bin/tofu
          rm -f "$ZIP" sums.txt tofu
      - run: tofu fmt -check -diff
      - name: Validate
        # -backend=false: validation needs the providers, not credentials or
        # state, so this runs without any AWS access at all.
        run: |
          tofu init -backend=false -input=false
          tofu validate
