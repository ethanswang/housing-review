<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="House">
  <!--
    The emoji is embedded as a codepoint, not as glyph artwork, so the viewer's
    own emoji font draws it. Nothing licensed is shipped, and there is no
    university trademark here either: this site states it is not affiliated
    with the University of Illinois.

    Consequence worth knowing: it renders differently on macOS, Windows and
    Android, because each supplies its own font.

    The newsprint tile stays. A glyph on a transparent ground disappears
    against a dark browser tab strip.
  -->
  <rect width="32" height="32" rx="5" fill="#f7f4ed"/>
  <text x="16" y="16" font-size="21" text-anchor="middle" dominant-baseline="central">🏠</text>
</svg>
